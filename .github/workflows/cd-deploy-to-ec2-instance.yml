name: JMA CI Workflow

on:
  workflow_dispatch:

env:
  DOCKER_REPO: jobyjfrancis/devops-bootcamp
  EC2_USER: ec2-user
  IMAGE_TAG: jma-1.0
  APP_CONTAINER_NAME: jma-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK
      uses: actions/setup-java@v1
      with:
        java-version: '11'

    - name: Build with Maven
      run: mvn clean package

    - name: Build Docker image
      run: docker build -t ${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }} .

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image
      run: docker push ${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:

    - name: Read EC2 IP from terraform output
      run: echo "EC2_IP=$(cat terraform/ec2_public_ip)" >> $GITHUB_ENV

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: $EC2_IP
        username: ${{ env.EC2_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          docker pull ${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }}
          docker run -d --name ${{ env.APP_CONTAINER_NAME }} ${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }}